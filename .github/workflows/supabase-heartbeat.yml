name: Supabase availability heartbeat

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Call Supabase heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

        run: |
          set -euo pipefail

          response=$(curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --request POST \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")

          echo "Heartbeat response: $response"
